[project]
name = "my-experiment"            # rename: lowercase, hyphens, no spaces
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    # faro's own git sources (napari-micromanager main, the virtual
    # microscope) and index pins carry over to this project.
    "faro",
    # "jupyterlab",   # uncomment if you run notebooks with Jupyter rather than VS Code
    # Add faro extras you need, for example:
    # "faro[cellpose]",
    # "faro[stardist]",
    # "faro[pertzlab-widgets]",   # the lab's pymmcore-widgets (stage map, ...)
    # On a real scope, add your lab package (it depends on faro):
    # "faro-pertzlab",
    # "faro-aoki",
]

[tool.uv.sources]
# Pick ONE of the three lines below (see templates/README.md in the faro repository).
faro = { git = "https://github.com/pertzlab/faro.git", branch = "main" }
# faro = { git = "https://github.com/pertzlab/faro.git", rev = "0123456789abcdef0123456789abcdef01234567" }
# faro = { path = "../../faro", editable = true }
# Your lab package, from git or from a local clone:
# faro-pertzlab = { git = "https://github.com/pertzlab/faro-pertzlab.git", branch = "main" }
# faro-pertzlab = { path = "../../faro-pertzlab", editable = true }

# [tool.uv]
# With a lab package: the lab package pins faro to its own source (git main).
# When the faro line above is anything else (a rev pin or a local clone),
# this replaces the lab package's pin; without it uv stops with
# "conflicting URLs for package `faro`".
# override-dependencies = ["faro"]
