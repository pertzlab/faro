[project]
name = "faro"
version = "1.0.0"
description = "FARO - Feedback Adaptive Real-time Optogenetics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "numpy",
    "pyarrow",
    "ipykernel",
    "ipywidgets",
    "matplotlib",
    "napari[Pyqt6]",
    "scikit-image",
    "tifffile",
    "pymmcore-plus>=0.17.3",
    "pymmcore-widgets",
    "trackpy",
    "napari-micromanager",
    "ome-writers",
    "napari-ome-zarr",
    "zarr>=3",
    # Pure-Python simulated microscope (brings numba and opencv). A base
    # dependency so the example notebook and the templates run right after
    # `uv sync`, without hardware or Micro-Manager.
    "virtual-microscope-teaching",
]

[project.scripts]
# Launch napari-micromanager on a faro microscope class (see
# faro/napari_launcher.py) so the Python-side setup a .cfg can't express --
# DMD blanking/hold, ROI-follows-binning, laser keepalive, per-scope MDA
# engine -- is applied before the GUI attaches to the core.
faro-napari = "faro.napari_launcher:main"

[project.optional-dependencies]

test = [
    "pytest",
    "pytest-xdist",
    # The suite exercises both tracking backends; motile is the non-default
    # one (trackpy is a core dep).
    "faro[motile]",
    "nbformat",
    "nbclient>=0.11.0",
]

motile = [
    "motile>=1.0",
]

stardist = [
    "stardist",
    "tensorflow",
    "csbdeep",
    ]

cellpose = [
    # 4.1.1 fixed a numpy 2.x crash in models._resize_gradients on the
    # GPU code path. Older versions are fine on CPU but blow up on GPU.
    "cellpose>=4.1.1",
    "torch",
    # torchvision is a transitive dep of cellpose, but listed explicitly
    # so [tool.uv.sources] picks up the cu128 index pin (uv only routes
    # source overrides for packages declared as direct deps).
    "torchvision",
    # cellpose imports cv2 but doesn't pin opencv itself; declare it here
    # so the cellpose extra is self-sufficient.
    "opencv-python",
    ]

convpaint = [
    "napari-convpaint",
    "scipy"
]

remote-segmentation = [
    "imaging-server-kit",
]


api74 = [
    "pymmcore==11.10.0.74.1"
]

api75 = [
    "pymmcore==12.2.2.75.0"
]


[[tool.uv.index]]
# CUDA 13.0 wheels. Requires NVIDIA driver >= 580.65.
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv]
conflicts = [
    [
        { extra = "api74" },
        { extra = "api75" },
    ],
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
virtual-microscope-teaching = { git = "https://github.com/hinderling/virtual-microscope-teaching.git" }
# The pertzlab integration branch: upstream main + the lab's stage map,
# tweaks and in-flight upstream fixes. See PERTZLAB.md on that branch.
pymmcore-widgets = { git = "https://github.com/pertzlab/pymmcore-widgets.git", branch = "pertzlab" }
# PyPI napari-micromanager is 0.2.0 (no MainWindow(mmcore=...) and predates
# the async-relevant fixes: _image_snapped race, device-leak teardown,
# preview-during-run). Track upstream main like the other faro envs.
napari-micromanager = { git = "https://github.com/pymmcore-plus/napari-micromanager.git", branch = "main" }

[tool.black]
# Same as black's default and the pre-commit hook (.pre-commit-config.yaml).
line-length = 88

[tool.pytest.ini_options]
markers = [
    "hardware: requires a real Pertzlab microscope (selected via --scope or FARO_SCOPE env var). Skipped by default.",
    "examples: executes the example notebooks and templates on the virtual microscope (slow).",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
